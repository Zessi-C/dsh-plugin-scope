                - sctda_code_sources
                - sctda_method_search
                - sctda_method_get
                - sctda_method_stats
                - sctda_method_external_search
                # Project method ledger: three real writes (register, alias,
                # source) plus its read surface. Every write requires an
                # already-initialised project; none can create one.
                - sctda_method_ledger_register
                - sctda_method_ledger_alias_add
                - sctda_method_ledger_source_add
                - sctda_method_ledger_list
                - sctda_method_ledger_get
                - sctda_method_ledger_sources
                # Immutable source snapshots: fetch (write) then read and
                # re-hash. A fetch is not a check and a hash is not support.
                - sctda_source_fetch
                - sctda_lit_fulltext
                - sctda_source_read
                - sctda_source_verify
                - sctda_source_list
                - sctda_ask
