[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sctda"
version = "0.1.0"
description = "SCTDA research kernel: screen annotated single-cell subsets, then propose cell-context-bound targets"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
tui = ["textual>=0.60"]

[project.scripts]
sctda = "sctda.cli:main"

[tool.setuptools]
py-modules = ["scope_knowledge"]

[tool.setuptools.packages.find]
where = ["src"]
