[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sctda"
version = "0.1.0"
description = "SCTDA research kernel: screen annotated single-cell subsets, then propose cell-context-bound targets"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
tui = ["textual>=0.60"]

[project.scripts]
sctda = "sctda.cli:main"

[tool.setuptools]
# ``scope_corpus`` is the read-only SQLite reader; it ships as code only. The
# database it reads is generated locally by tools/build_runtime_corpus.py and is
# never packaged.
py-modules = ["scope_knowledge", "scope_corpus"]

[tool.setuptools.packages.find]
where = ["src"]
